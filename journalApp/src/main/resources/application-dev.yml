spring:
  data:
    mongodb:
      database: JournalApp
      auto-index-creation: true
    redis:
      host: hypermodern-turbolight-copper-85709.db.redis.io
      port: 16745
      username: default
      password: ${REDIS_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER_EMAIL}
    password: ${MAIL_USER_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080